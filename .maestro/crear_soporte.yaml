appId: com.taskmanager.app
---
# 1. Abrir la app desde un estado limpio y entrar al flujo de soporte
- launchApp:
    clearState: true
- assertVisible: "Task Manager"
- tapOn: "Flujo de Soporte Técnico"
- assertVisible: "Crear Solicitud de Soporte Técnico"
- scrollUntilVisible:
    element:
      text: "No hay solicitudes de soporte técnico"
    direction: DOWN
    centerElement: true
- assertVisible: "No hay solicitudes de soporte técnico"
- scrollUntilVisible:
    element:
      id: "input-nombre-completo"
    direction: UP
    centerElement: true

# 2. Completar el formulario con datos válidos
- tapOn:
    id: "input-nombre-completo"
- inputText: "Laura Gómez"
- tapOn:
    id: "input-celular"
- inputText: "3001234567"
- tapOn:
    id: "input-area"
- inputText: "Tecnología"
- scrollUntilVisible:
    element:
      text: "Error de la aplicación"
    direction: DOWN
    centerElement: true
- tapOn: "Error de la aplicación"
- scrollUntilVisible:
    element:
      id: "input-descripcion"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "input-descripcion"
- inputText: "La aplicación falla al iniciar sesión"
- scrollUntilVisible:
    element:
      text: "Alta"
    direction: DOWN
    centerElement: true
- tapOn: "Alta"
- scrollUntilVisible:
    element:
      id: "input-fecha-maxima"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "input-fecha-maxima"
- inputText: "2026-08-20"
- hideKeyboard

# 3. Crear la solicitud y validar el resultado en la lista
- scrollUntilVisible:
    element:
      id: "btn-crear-soporte"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "btn-crear-soporte"
- scrollUntilVisible:
    element:
      text: "Solicitud de soporte técnico creada exitosamente"
    direction: DOWN
    centerElement: true
- assertVisible: "Solicitud de soporte técnico creada exitosamente"
- scrollUntilVisible:
    element:
      text: "1 solicitud registrada"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: "Laura Gómez"
    direction: DOWN
    centerElement: true
- assertVisible: "Laura Gómez"
- assertVisible: "1 solicitud registrada"
- assertVisible: "Abierta"
